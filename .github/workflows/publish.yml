# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────────
#
# No minimum @n8n/node-cli version is needed for CI publishing anymore —
# CI runs `npm publish --provenance` directly. `npm run release`
# (n8n-node release) is only an optional local helper and must never run in CI
# because it is interactive (prompts for bump, changelog, commit/tag/push).
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# OIDC Trusted Publishing (no long-lived secrets):
#   1. Log in to npmjs.com and open package n8n-nodes-cactus-needle settings.
#   2. Under "Publish access" → "Trusted Publishers", click "Add a publisher".
#   3. Select GitHub Actions and fill in:
#        Repository owner: nicodemus-opon
#        Repository name:  n8n-nodes-cactus-needle
#        Workflow name:    publish.yml
#        Environment:      (leave blank)
#   4. Leave the NPM_TOKEN secret unset. GitHub's OIDC token is used instead.
#      `registry-url` below is required to wire npm auth to that OIDC token.
#      Provenance is signed by GitHub's OIDC infrastructure.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# This workflow triggers on tags matching "*.*.*" (e.g. 0.2.0).
# If you prefer tags with a "v" prefix (e.g. v0.2.0), change the filter to:
#   tags: ['v*.*.*']
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# 0.1.0 was published manually from a terminal. All subsequent releases go
# via GitHub: bump locally, push the tag, CI publishes with provenance.
#
#   npm run lint && npm run build
#   npm version patch -m "chore(release): %s"  # or minor/major, e.g. 0.1.0 -> 0.1.1
#   git push origin main --follow-tags         # pushes commit + tag (e.g. 0.1.1)
#
# Pushing a tag like 0.1.1 triggers this workflow, which publishes to npm.
# Never run `npm run release` / `npm publish` in CI or locally for a
# GitHub-managed release — CI handles publishing. Do not re-push 0.1.0;
# npm rejects republishing an existing version.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      # See "TAG CONVENTION" above if you prefer tags with a "v" prefix.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish to npm with provenance
        # OIDC Trusted Publishing: auth comes from the id-token above via
        # registry-url, no NPM_TOKEN needed. Tag (e.g. 0.1.1) must match
        # package.json version; npm rejects republishing an existing version.
        run: npm publish --provenance --access public
