name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint-build-unit:
    name: Lint, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests (mocked, no server)
        run: npm run test:unit

  integration:
    name: Integration tests (needs server)
    runs-on: ubuntu-latest
    # Only runs when explicitly requested: push a branch with `live` in the name,
    # or set the `run-live` label / workflow_dispatch. Avoids red CI without a server.
    if: github.event_name == 'workflow_dispatch' || contains(github.ref_name, 'live')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Live integration tests
        run: npm run test:integration
        env:
          CACTUS_BASE_URL: http://localhost:7860
